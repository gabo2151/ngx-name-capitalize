name: Node.js Package

on:
  release:
    types: [created]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-npm:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node ships npm 10.x.
      # Pin to the 11.x line: it runs on both Node 20 and 22 and supports OIDC,
      # while npm@latest (12.x) requires a very recent Node 22.22+/24.15+.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx -p @angular/cli@16 ng build ngx-name-capitalize

      - name: Publish to NPM
        run: npm publish --provenance --access public
        working-directory: dist/ngx-name-capitalize
