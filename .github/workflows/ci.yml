# IMPORTANT: this file must keep the name `ci.yml`.
# The npm trusted publisher (OIDC) for ngx-name-capitalize is bound to
# gabo2151/ngx-name-capitalize + the workflow FILENAME. Renaming this file breaks
# publishing with an auth error that never mentions the filename.
#
# This is the `v2` branch: the Angular 14 – 15 line, published under `legacy-v2`.
# It must never move the `latest` dist-tag.

name: Node.js Package

on:
  release:
    types: [created]
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  # name-capitalize comes from an open peer range, so it can change under this
  # branch without anyone pushing a commit.
  schedule:
    - cron: '0 9 * * 1'

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check both READMEs are in sync
        run: npm run readme:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  # Angular 14's CLI wants an Angular-14-era Node, while trusted publishing wants a
  # very new one. Building here and publishing the artifact in a separate job lets
  # each step run on the Node it actually needs.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Links the built bundle with every Angular major this branch's peer range
  # promises — here 14 and 15, since the 3.x line takes over at 16.
  compat:
    name: Verify Angular compatibility
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # `--write` regenerates the verified range in README.md from this run. On
      # `main` a diff means a new Angular shipped and a pull request is opened. Here
      # the range is frozen at 14 – 15, so a diff can only mean the README claims
      # something that was not verified — which should fail the build.
      - name: Link against every supported Angular major
        run: node scripts/verify-angular-compat.mjs --write

      - name: Fail if the README claims a range that was not verified
        run: |
          if ! git diff --quiet -- README.md; then
            echo "::error::README.md's verified range does not match what CI just linked."
            git --no-pager diff -- README.md
            exit 1
          fi
          echo "README.md matches the verified range."

  # name-capitalize is an open-ended peer dependency, so consumers can resolve a
  # newer engine than this branch locks. Run the suite against whatever it
  # publishes today, to catch an engine change before users do.
  engine-canary:
    name: Test against name-capitalize@latest
    runs-on: ubuntu-latest
    # Informational: a failure here means the engine changed, not that this commit
    # is bad. It should open an issue, not block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Upgrade the engine to latest
        run: npm install --no-save name-capitalize@latest

      - name: Report the resolved engine version
        run: npm ls name-capitalize || true

      - name: Run tests
        run: npm test

  publish-npm:
    name: Stage release on npm
    needs: [test, build, compat]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Node 24 for npm >= 11.5.1, which trusted publishing (OIDC) requires. No
      # Angular toolchain runs here — the package was already built by the `build`
      # job on a Node that Angular 14 supports.
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Check the tag matches the package version, on the 2.x line
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./dist/ngx-name-capitalize/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $PKG"
            exit 1
          fi
          case "$PKG" in
            2.*) ;;
            *) echo "::error::$PKG is not a 2.x version; the v2 branch must not publish it"; exit 1 ;;
          esac
          echo "Publishing version $PKG under the legacy-v2 tag"

      # STAGED publish under `legacy-v2`, never `latest`: Angular 16+ users must keep
      # resolving the 3.x line. The version becomes installable only after a manual
      # `npm stage approve` with 2FA.
      #
      # No NODE_AUTH_TOKEN: the package authenticates via npm trusted publishing (OIDC).
      - name: Stage release on NPM
        run: npm stage publish --provenance --access public --tag legacy-v2
        working-directory: dist/ngx-name-capitalize

      - name: Explain the approval step
        if: success()
        run: |
          {
            echo "### 📦 \`${{ github.ref_name }}\` is staged, not yet public"
            echo ""
            echo "The version was uploaded to npm but **cannot be installed yet**."
            echo "Approve it from a machine with your npm 2FA:"
            echo ""
            echo '```bash'
            echo "npm stage list"
            echo "npm stage view <stage-id>   # inspect before approving"
            echo "npm stage approve <stage-id>"
            echo '```'
            echo ""
            echo "Then confirm the dist-tag did not touch \`latest\`:"
            echo ""
            echo '```bash'
            echo "npm dist-tag ls ngx-name-capitalize"
            echo "npm dist-tag add ngx-name-capitalize@<version> legacy-v2   # if needed"
            echo '```'
            echo ""
            echo "To discard it instead: \`npm stage reject <stage-id>\`"
          } >> "$GITHUB_STEP_SUMMARY"
